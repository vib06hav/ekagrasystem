        kc_ids:
          - K1
          - K2
          - K3
        relation_ids:
          - R1
        misconception_ids:
          - M1
        material_blueprint: |
          Case A:

          ```python
          def fib_a(n):
              if n <= 1:
                  return n
              return fib_a(n - 1)
          ```

          Case B:

          ```python
          def fib_b(n):
              if n <= 1:
                  return n
              return fib_b(n - 1) + fib_b(n - 2)
          ```
        allowed_behavior:
          - present aligned cases
          - ask for diagnostic difference
        prohibited_behavior:
          - "Prohibition:\nDo not introduce caching or efficiency as the comparison dimension.\n\n---"
        completion_evidence: |
          The two-predecessor recurrence is the central structure required for recursive Fibonacci.
