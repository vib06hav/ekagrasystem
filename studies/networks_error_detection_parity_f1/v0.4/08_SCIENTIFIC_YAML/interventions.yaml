    data-error detection.
  required_moves:
  - define new checking relation
  - derive a condition for all passing data-error patterns
  - construct a counterexample
  - explain why presentation changes and constraint changes differ
  prohibition: Do not expose assessment-only grouped partitions X7/X8/X9.
