      - id: C2-P1-MOVE-2
        transition_id: C2
        pedagogy_id: P1
        title: Part B — show storage as a separate mechanism
        purpose: |
          Model several distinct components that become relevant once the learner already understands basic recursive Fibonacci.
        kc_ids:
          - K4
          - K5
          - K6
          - K7
          - K8
          - K9
        relation_ids:
          - R2
          - R3
          - R4
          - R5
        misconception_ids:
          - M2
          - M3
          - M5
          - M6
          - M8
        material_blueprint: |
          Introduce a small cache table conceptually:

          ```text
          input   stored result
            2          1
            3          2
          ```

          Explain:

          - a solved value can be stored with its input;
          - the function can later check whether an input already has a stored result;
          - a stored result can be reused.
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - "C2 boundary:\nThe Tutor may name and demonstrate the pieces, but should not make the full C3 causal chain the
            central instructional object.\n\nThe learner is being equipped with multiple relevant components."
        completion_evidence: |
          All target components have been modeled as identifiable pieces and the learner can recognize at least several of them.

          ---
        next_move_ids:
          - C2-P1-MOVE-3
      - id: C2-P1-MOVE-3
        transition_id: C2
        pedagogy_id: P1
        title: Part C — show shared state
        purpose: |
          Model several distinct components that become relevant once the learner already understands basic recursive Fibonacci.
        kc_ids:
          - K4
          - K5
          - K6
          - K7
          - K8
          - K9
        relation_ids:
          - R2
          - R3
          - R4
          - R5
        misconception_ids:
          - M2
          - M3
          - M5
          - M6
          - M8
        material_blueprint: |
          Explain that recursive calls must be using the same relevant cache if one branch is to benefit from work done in another branch.
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - "C2 boundary:\nThe Tutor may name and demonstrate the pieces, but should not make the full C3 causal chain the
            central instructional object.\n\nThe learner is being equipped with multiple relevant components."
        completion_evidence: |
          All target components have been modeled as identifiable pieces and the learner can recognize at least several of them.

