    moves:
      - id: C3-P1-MOVE-1
        transition_id: C3
        pedagogy_id: P1
        title: Naive recursive model
        purpose: |
          Use a complete solved execution example to model the causal relationship:

          ```text
          repeated subproblems
          → repeated computation
          → storage
          → lookup/reuse
          → avoided recursive recomputation
          ```

          while preserving the recurrence.
        kc_ids:
          - K10
          - K11
        relation_ids:
          - R2
          - R3
          - R4
          - R5
          - R6
          - R7
          - R8
          - R9
        misconception_ids:
          - M3
          - M4
          - M5
          - M6
          - M7
          - M8
          - M9
        material_blueprint: |
          ```python
          def fib(n):
              if n <= 1:
                  return n
              return fib(n - 1) + fib(n - 2)
          ```

          Illustrative reasoning:

          ```text
          When fib(5) is computed, fib(3) can be reached while solving fib(4)
          and then requested again from another branch.

          The second fib(3) request is the same mathematical subproblem.

          Because the naive implementation retained no result for fib(3),
          that second request triggers the recursive work for fib(3) again.
          ```
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - "Prohibitions:\n- no tabulation;\n- no claim that recurrence changes;\n- no assessment item verbatim."
        completion_evidence: |
          The integrated mechanism has been modeled and the learner has engaged with or restated it.

          ---
        next_move_ids:
          - C3-P1-MOVE-2
      - id: C3-P1-MOVE-2
        transition_id: C3
        pedagogy_id: P1
        title: Memoized recursive model
        purpose: |
          Use a complete solved execution example to model the causal relationship:

          ```text
          repeated subproblems
          → repeated computation
          → storage
          → lookup/reuse
          → avoided recursive recomputation
          ```

          while preserving the recurrence.
        kc_ids:
          - K10
          - K11
        relation_ids:
          - R2
          - R3
          - R4
          - R5
          - R6
          - R7
          - R8
          - R9
        misconception_ids:
          - M3
          - M4
          - M5
          - M6
          - M7
          - M8
          - M9
        material_blueprint: |
          ```python
          def fib(n, memo=None):
              if memo is None:
                  memo = {}

              if n in memo:
                  return memo[n]

              if n <= 1:
                  return n

              memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
              return memo[n]
          ```

          Model:

          1. first request for a non-cached subproblem recursively solves it;
          2. its result is stored under the input;
          3. a later request checks the shared cache;
          4. if the result exists, it is returned;
          5. the recursive expansion for that subproblem is avoided;
          6. the Fibonacci recurrence remains unchanged.
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - "Prohibitions:\n- no tabulation;\n- no claim that recurrence changes;\n- no assessment item verbatim."
        completion_evidence: |
          The integrated mechanism has been modeled and the learner has engaged with or restated it.

          ---
        next_move_ids:
          - C3-P1-MOVE-3
