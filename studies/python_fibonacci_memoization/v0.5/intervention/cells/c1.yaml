  - id: C1-P2
    transition_id: C1
    pedagogy_id: P2
    instructional_intent: |
      Guide the learner to construct the recurrence-to-recursion relationship.
    missing_structure: A coherent recurrence-to-recursion relationship.
    target_kc_ids:
      - K1
      - K2
      - K3
    target_relation_ids:
      - R1
    relevant_misconception_ids:
      - M1
    prohibitions:
      - Do not teach memoization or give a complete solution first.
    completion_condition: |
      The learner has constructed the central recurrence/recursive relationship or the intervention budget is exhausted.

      ---
    max_tutor_turns: 8
    treatment_constraints: |
      Prohibition:
      Do not shift into memoization or repeated-work discussion.
    move_ids:
      - C1-P2-MOVE-1
      - C1-P2-MOVE-2
      - C1-P2-MOVE-3
    moves:
      - id: C1-P2-MOVE-1
        transition_id: C1
        pedagogy_id: P2
        title: Required questioning progression
        purpose: |
          Guide the learner to construct the recurrence-to-recursion relationship.
        kc_ids:
          - K1
          - K2
          - K3
        relation_ids:
          - R1
        misconception_ids:
          - M1
        material_blueprint: |
          The Tutor should guide approximately through these functions:

          1. **Sequence dependency**
             - Ask how a later Fibonacci value is obtained from earlier ones.
             - Use a concrete example if needed, such as `0, 1, 1, 2, 3, 5`.

          2. **Two predecessors**
             - Elicit that `fib(n)` depends on both `fib(n-1)` and `fib(n-2)`.

          3. **Recursive representation**
             - Ask what a function computing `fib(n)` could request from itself.

          4. **Termination**
             - Ask what should happen at `n=0` and `n=1`, and why recursion cannot continue indefinitely.

          5. **Synthesis**
             - Ask the learner to state the basic recursive rule in words or simple pseudocode.
        allowed_behavior:
          - ask bounded questions
          - request prediction
        prohibited_behavior:
          - "Prohibition:\nDo not shift into memoization or repeated-work discussion."
        completion_evidence: |
          The learner has constructed the central recurrence/recursive relationship or the intervention budget is exhausted.

          ---
        next_move_ids:
          - C1-P2-MOVE-2
