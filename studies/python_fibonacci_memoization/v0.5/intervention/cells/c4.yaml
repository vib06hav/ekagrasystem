    moves:
      - id: C4-P1-MOVE-1
        transition_id: C4
        pedagogy_id: P1
        title: 'Worked example: superficially cached but ineffective sharing'
        purpose: |
          Model how to evaluate an unfamiliar recursive Fibonacci implementation by checking memoization invariants rather than matching memorized syntax.
        kc_ids:
          - K12
          - K13
          - K14
        relation_ids:
          - R9
          - R10
          - R11
          - R12
        misconception_ids:
          - M6
          - M7
          - M8
          - M10
        material_blueprint: |
          ```python
          def fib(n):
              memo = {}

              if n in memo:
                  return memo[n]

              if n <= 1:
                  return n

              memo[n] = fib(n - 1) + fib(n - 2)
              return memo[n]
          ```
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - Follow the shared intervention envelope and assigned pedagogy without switching treatments.
        completion_evidence: |
          The invariants have been modeled and applied to at least one unfamiliar implementation.

          ---
        next_move_ids:
          - C4-P1-MOVE-2
      - id: C4-P1-MOVE-2
        transition_id: C4
        pedagogy_id: P1
        title: Modeled analysis
        purpose: |
          Model how to evaluate an unfamiliar recursive Fibonacci implementation by checking memoization invariants rather than matching memorized syntax.
        kc_ids:
          - K12
          - K13
          - K14
        relation_ids:
          - R9
          - R10
          - R11
          - R12
        misconception_ids:
          - M6
          - M7
          - M8
          - M10
        material_blueprint: |
          The Tutor should reason explicitly:

          1. There is a dictionary, but dictionary presence alone is not enough.
          2. Every call to `fib` creates a new empty `memo`.
          3. A result stored inside one call is not available to a sibling recursive call.
          4. Therefore repeated subproblems cannot reliably reuse previously stored values across the recursive tree.
          5. The code is still recursively computing Fibonacci, but it does not realize the intended shared memoization mechanism.

          Then model a valid alternative whose cache is shared:

          ```python
          def fib(n, memo):
              if n in memo:
                  return memo[n]

              if n <= 1:
                  return n

              result = fib(n - 1, memo) + fib(n - 2, memo)
              memo[n] = result
              return result
          ```
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - Follow the shared intervention envelope and assigned pedagogy without switching treatments.
        completion_evidence: |
          The invariants have been modeled and applied to at least one unfamiliar implementation.

          ---
        next_move_ids:
          - C4-P1-MOVE-3
      - id: C4-P1-MOVE-3
        transition_id: C4
        pedagogy_id: P1
        title: Abstraction
        purpose: |
          Model how to evaluate an unfamiliar recursive Fibonacci implementation by checking memoization invariants rather than matching memorized syntax.
        kc_ids:
          - K12
          - K13
          - K14
        relation_ids:
          - R9
          - R10
          - R11
          - R12
        misconception_ids:
          - M6
          - M7
          - M8
          - M10
        material_blueprint: |
          The Tutor should extract invariants:

          ```text
          valid memoized recursion does not depend on one exact code layout

          what matters is:
          - consistent subproblem identity;
          - shared accessible stored results;
          - lookup before redundant recursive expansion;
          - correct storage of newly solved values;
          - preserved recurrence.
          ```
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - Follow the shared intervention envelope and assigned pedagogy without switching treatments.
        completion_evidence: |
          The invariants have been modeled and applied to at least one unfamiliar implementation.

          ---
        next_move_ids: []
