source: 08_SCIENTIFIC_YAML/assessment_families.yaml (v0.4; unchanged)
scope: F1_ONLY
policy_rule: Backend resolves source contract to typed policy before generation. Never use LLM-provided slot IDs,
  never parse English constraint strings, never impose fixed numerical vectors or display letters.
shared_bounds_refs:
- 08_SCIENTIFIC_YAML/knowledge.yaml#runtime_numeric_scope
- 08_SCIENTIFIC_YAML/scenario_rules.yaml#two_dimensional_dimensions
- 08_SCIENTIFIC_YAML/scenario_rules.yaml#generation_constraints
default_learner_fact_policy: input_facts_only; project task-specific givens, NEVER private oracle result, target
