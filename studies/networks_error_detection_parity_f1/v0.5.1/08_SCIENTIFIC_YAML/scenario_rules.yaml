schema: ekagra.scientific.scenarios.v0.5-candidate
status: CANDIDATE_UNAPPROVED_REQUIRES_HUMAN_REVIEW_AND_RUNTIME_INTEGRATION
policy:
  fresh_per_instance: true
  no_runtime_fixture_reuse_as_contract: true
  instruction_assessment_disjoint_instance_ids: Use separate instruction-only and independent-assessment instance namespaces;
    compare actual content signatures when checking accidental duplicate examples.
  randomization_independent_of_treatment: true
  correctness_from_oracle_not_llm: Mathematical facts for ALL actual instructional and assessment instances must be computed
    by an independent parity oracle before display; LLM free text does not certify counts or grid outcomes.
  independent_option_display_shuffle: true
  difficulty_balance: Match scientific content scope and reasonable manual workload across pedagogies; do not demand
    identical example strings or turn counts.
numeric_scope_ref: knowledge.yaml#runtime_numeric_scope
families:
- id: sender_parity
  sampling_definition: Choose a fresh data string and explicit parity convention; ask about the sender check bit.
  oracle_rule: Parity bit is the one value making full-frame number-of-ones parity equal the stated convention.
  oracle_function: sender_bit
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: receiver_parity
  sampling_definition: Start from a valid single-parity frame; create valid or specified altered received frame.
  oracle_rule: Receiver pass is parity(received full frame)==agreed convention; pass is not proof of no flips.
  oracle_function: receiver_pass
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: single_flip_1d
  sampling_definition: Choose valid full frame then flip exactly one transmitted position, possibly the check bit.
  oracle_rule: One flip toggles complete-frame parity, so receiver test fails.
  oracle_function: receiver_pass
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: multiflip_1d
  sampling_definition: Choose valid full frame and a bounded set of distinct flipped transmitted positions.
  oracle_rule: Receiver fails iff number of flips is odd; cannot infer error count from one failure.
  oracle_function: receiver_pass
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: checkbit_1d
  sampling_definition: Generate a valid full frame with marked data and parity positions, optionally flip check bit.
  oracle_rule: Parity-check bit is included in tested frame; flip alters test exactly as any single bit.
  oracle_function: receiver_pass
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: full2d_single
  sampling_definition: Generate full small even-parity row-column block incl corner and exactly one flipped transmitted
    position.
  oracle_rule: Exactly one row and one column fail, whose intersection is the altered position under exactly-one-flip
    assumption.
  oracle_function: grid_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: full2d_pair
  sampling_definition: Generate a full small even-parity row-column block with two distinct altered transmitted positions.
  oracle_rule: Compute failed-row and failed-column sets from row/column syndromes; at least one fails; no unconditional
    unique two-flip inference.
  oracle_function: grid_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: full2d_rectangle
  sampling_definition: Generate a valid small 2D grid and change all four data bits at corners of a nondegenerate rectangle.
  oracle_rule: Every affected row and column has two changes and hence all parity tests pass; corruption remains undetected.
  oracle_function: grid_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: full2d_compare
  sampling_definition: Hold data and error universe fixed while contrasting global single parity and full 2D row-column
    checks.
  oracle_rule: Compute each scheme’s applicable checks separately; check-bit-error comparisons require explicitly matched
    error universes.
  oracle_function: grid_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: full2d_checkbit
  sampling_definition: Generate full 2D block and flip one named row, column, or corner check-bit position.
  oracle_rule: Compute syndrome including the altered check-bit coordinate; single-flip intersection applies.
  oracle_function: grid_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: grouped_checks
  sampling_definition: Generate <=8 data positions and 2–3 explicitly declared nonempty checked subsets with an independent
    even-parity check bit for each.
  oracle_rule: For data-only flips, check j fails iff number of flipped data positions in subset j is odd.
  oracle_function: group_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: grouped_two_flip
  sampling_definition: Generate a grouped-check scheme with pairs sharing or differing in checked-subset membership.
  oracle_rule: A two-data-bit alteration is invisible iff the two positions have identical check-membership signatures.
  oracle_function: group_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: grouped_uncovered
  sampling_definition: Generate a grouped-check scheme with at least one data position in no checked subset.
  oracle_rule: A flip on an uncovered data position violates no check; an added check covering it detects that single
    data flip.
  oracle_function: group_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: grouped_evasion
  sampling_definition: Generate a small bounded grouped-check scheme with a nonempty error subset that preserves every
    check.
  oracle_rule: All checks pass iff each checked subset contains an even number of flipped data positions; demonstrate
    a nonempty witness by oracle.
  oracle_function: group_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: grouped_add_check
  sampling_definition: Generate a scheme and known witness; introduce a candidate new parity subset while holding the
    data-only error universe fixed.
  oracle_rule: The new check detects that witness iff its overlap with witness positions has odd size; cannot promise
    universal superiority across arbitrary error universes.
  oracle_function: group_syndrome
  acceptance: Generate actual instance parameters and verify by independent oracle; no preselected bit string or fixed
    key.
- id: full2d_four_compare
  sampling_definition: Generate both rectangle and non-rectangle four-data-flip patterns on a full row-column grid, computing
    each resulting syndrome independently.
  oracle_rule: Pass if and only if every row and column has an even flip count; total count four alone is insufficient.
  oracle_function: grid_syndrome
  acceptance: Produce one valid rectangular and one independently verified non-rectangular pattern; compare their row/column
    parity outcomes.
- id: bit_sequence_intro
  sampling_definition: Short simple sequences including a single 0 or 1 and two distinct bit sequences; novice conceptual
    representation, no coding or conversion.
  oracle_rule: Every displayed position has binary value; displayed counts of 1s are exact.
  oracle_function: parity / manual binary validator
  acceptance:
  - Bit positions and number of 1s verified
  - No binary arithmetic or encoding requirements
- id: transmission_flip_intro
  sampling_definition: A sender bit string and receiver bit string with exactly zero or one declared 0↔1 changes, labeled
    by outside-instructor versus receiver perspective.
  oracle_rule: Compare corresponding positions for exact flips; do not assume receiver has sent original.
  oracle_function: flip_positions
  acceptance:
  - Sender/receiver information distinction explicit
  - Transmission rather than software-error model
- id: checkbit_motivation
  sampling_definition: Payload versus payload plus a clearly marked extra checking position with a declared shared-rule
    need; DO NOT calculate a parity bit before C1.4.
  oracle_rule: No numerical check-bit value demanded until even or odd convention stated.
  oracle_function: none_pre_rule
  acceptance:
  - Conceptual only
  - Payload and redundant checking position distinguished
- id: full2d_build
  sampling_definition: Small nonempty data grid and fully verified appended row, column, and corner even-parity checking
    bits.
  oracle_rule: All complete transmitted rows and columns pass even parity after corner construction.
  oracle_function: full_grid
  acceptance:
  - All check-bit cells including corner labeled
  - Grid coordinate convention explicit
- id: full2d_three_mimic
  sampling_definition: A full even-parity grid with a one-flip pattern at corner (r,c) and a three-flip L-pattern at
    distinct (r,c2),(r2,c),(r2,c2), with r≠r2 and c≠c2; both have same one-row/one-column syndrome.
  oracle_rule: Compare computed failing rows/columns for one-flip and three-flip patterns; require exact equality and
    distinct changed positions.
  oracle_function: grid_syndrome
  acceptance:
  - At least two complete rows and columns
  - Two patterns explicitly distinct, syndrome equality oracle-tested
  - C3 only
- id: full2d_evidence
  sampling_definition: Fresh familiar full-grid case with stated receiver syndrome and multiple oracle-verified candidate
    patterns; distinguish detectable ambiguity and undetected corruption.
  oracle_rule: Compute all supplied candidate syndromes; only patterns with matching failed row/column sets are consistent
    with observations.
  oracle_function: grid_syndrome
  acceptance:
  - Receiver is not given original data
  - Case explains that reverse inference needs assumptions
  - C3 only
c4_guardrails:
- Groupings must be unfamiliar to the learner in assessment, but the general idea of group checks may have been taught
- Assumptions must state whether only data-bit errors or check-bit errors are allowed
- Require class-level inference for subjective EA evidence; one novel numerical prediction is insufficient
- No CRC or novel topic transfer
two_dimensional_dimensions:
  allowed_data_rows:
  - 2
  - 3
  allowed_data_columns:
  - 2
  - 3
  - 4
  matrix_rules: include row checks, column checks and corner bit so every transmitted cell belongs to one row and one
    column
  manual_workload: never require manual count of more than 8 positions for a single parity calculation; supply valid
    frame/check status when more involved
  four_flip_cases: rectangular vs non-rectangular four distinct data positions only when adequate cells exist
one_dimensional_conventions:
- even
- odd
generation_constraints:
- For sender_parity C1-A1 use even convention and for C1-A2 use odd; for other relevant blueprints convention explicitly
  declared and balanced
- For two-flip conditions sample distinct transmitted positions, and declare if data-only for cross-scheme claims
- For C4 universal claims quantify explicitly over DATA-ONLY flips, unless another universe is formally specified
- Generated grouped check schemes may have overlaps and uncovered positions where the blueprint permits; do not assume
  checks are disjoint
- No fixed parity result, ones count, bit index or correct letter imposed by a reusable assessment contract
scope_by_section:
  C1:
  - bit_sequence_intro
  - transmission_flip_intro
  - checkbit_motivation
  - sender_parity
  - receiver_parity
  - single_flip_1d
  C2:
  - sender_parity
  - receiver_parity
  - single_flip_1d
  - multiflip_1d
  - checkbit_1d
  - full2d_build
  - full2d_single
  - full2d_pair
  - full2d_checkbit
  - full2d_compare
  C3:
  - multiflip_1d
  - full2d_single
  - full2d_pair
  - full2d_compare
  - full2d_rectangle
  - full2d_three_mimic
  - full2d_evidence
  C4:
  - grouped_checks
  - grouped_two_flip
  - grouped_uncovered
  - grouped_evasion
  - grouped_add_check
construction_cautions:
- Default 2D convention is even parity. Do not assert that arbitrarily sized full rectangular grids can satisfy odd parity
  on every full row and column without checking consistency of row and column counts.
- Always specify whether a check family includes flipping transmitted checking bits. Grouped families inherited from
  v0.4 restrict some generated assessment error sets to DATA_ONLY flips; this does not weaken the full general theorem.
- Do not generate three-flip ambiguity or rectangle-miss tasks as C2 assessed abilities; these are C3.
- Full 2D two-bit detection means any two distinct transmitted positions, not merely two payload cells.
- For introduced arbitrary group checks, explicitly list each group and its own transmitted check-bit position; never
  treat check bit as exempt from transmission errors unless DATA_ONLY case declared.
- Do not reuse historical fixed assessment or instruction bit strings; freeze fresh generated instances before question
  authoring.
