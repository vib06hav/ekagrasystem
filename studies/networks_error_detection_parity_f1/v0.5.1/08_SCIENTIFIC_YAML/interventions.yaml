  - K4
  - K5
  - K6
  - K7
  - K8
  - K9
  - K20
  - K21
  subsection_order: &id005
  - C2.1
  - C2.2
  - C2.3
  - C2.4
  section_level_moves:
  - subsection_id: C2.1
    instructional_destination: 'Understand the two major limitations of a single parity check: lack of error localization
      and missed even-flip error patterns.'
  - subsection_id: C2.2
    instructional_destination: Understand how full two-dimensional parity is constructed and how multiple row and column
      checks operate on the transmitted bits.
  - subsection_id: C2.3
    instructional_destination: Understand how full two-dimensional parity can locate and correct a single flipped transmitted
      bit **under the stated single-error assumption**.
  - subsection_id: C2.4
    instructional_destination: Understand full 2D parity's two-bit detection guarantee and distinguish that guarantee
      from reliable location or correction of both errors.
