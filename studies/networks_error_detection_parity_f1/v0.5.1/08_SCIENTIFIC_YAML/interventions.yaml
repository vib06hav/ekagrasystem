- id: C4-P1
  transition_id: C4
  pedagogy_id: P1
  scientific_goal: Teach abstraction beyond grid checks, justified general conditions, counterexamples, and evaluating
    an added rule, not a novel coding algorithm.
  target_refs:
  - K17
