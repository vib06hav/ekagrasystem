        material_blueprint: |
          Present two execution snapshots for the same requested subproblem.

          Case A:

          ```text
          Request: fib(3)
          Stored entries: none
          ```

          Case B:

          ```text
          Request: fib(3)
          Stored entries: {3: 2}
          ```

          Ask:

