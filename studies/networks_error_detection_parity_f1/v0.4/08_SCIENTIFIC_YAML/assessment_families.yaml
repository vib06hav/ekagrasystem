schema: ekagra.scientific.assessment_families.v0.4
status: CANDIDATE_UNAPPROVED
scope: F1 parity ONLY
question_generation: All item contracts define VARIABLE question families, never fixed learner-facing instances.
  Scenario values and option positions are instance-specific.
form_policy:
  transitions: 4
  blueprints_per_transition: 4
  mcqs_per_blueprint: 3
  subjective_per_blueprint: 1
  source_precedence: Slot contract + referenced shared science + independently verified instance; LLM only realizes
    prose and semantic Judge only evaluates submitted response.
  form_allocation: Random among available unexposed blueprints for target transition independently of pedagogy;
    no automatic silent reuse; repeated-attempt exhaustion is unresolved pending protocol design.
  source_distribution: Instructional and assessment instances must not share frozen instance identifiers; reject
    identical numerical scenarios where exposure is documented.
roles_by_transition:
- transition_id: C1
  roles:
  - slot: 1
    role: sender rule or parity-bit interpretation
  - slot: 2
    role: complete-frame receiver test
  - slot: 3
    role: stated detection consequence
  - slot: 4
    role: elicitation of one usable parity aspect with opportunity for sender-receiver connection
- transition_id: C2
  roles:
  - slot: 1
    role: independent one-dimensional property
  - slot: 2
    role: independent two-dimensional property
  - slot: 3
    role: distinct boundary/comparison property
  - slot: 4
    role: separate correct aspects spanning one- and two-dimensional parity
- transition_id: C3
  roles:
  - slot: 1
    role: causal effect on one-dimensional constraint
  - slot: 2
    role: causal relation among full two-dimensional checks
  - slot: 3
    role: causal limitation or cross-constraint comparison
  - slot: 4
    role: integrated case-specific constraint -> alteration -> observations -> inference
- transition_id: C4
  roles:
  - slot: 1
    role: interpret a newly defined check-group model
  - slot: 2
    role: derive consequence under new groups
  - slot: 3
    role: evaluate general limitation or principled modification
  - slot: 4
    role: derive general evasion condition plus nontrivial justified consequence
blueprints:
- id: C1-A1
  transition_id: C1
  title: Build/check even-parity frame
  blueprint_focus: Build/check even-parity frame
  scenario_exposure: Generated and independently verified; exclude instruction-only frozen instances.
  required_solo_structure: One usable component is sufficient for U. Do not require parity flip-count theorem
    or 2D understanding.
  target_refs: &id001
  - K1
  - K2
  - K3
  - R1
  items:
  - id: C1-A1-Q1
    type: MCQ
    slot_number: 1
    transition_id: C1
    blueprint_id: C1-A1
    shared_role: sender rule or parity-bit interpretation
    scientific_purpose: Select the sender check bit for a freshly generated even-parity payload
    solo_evidence_role: one applicable sender rule
    scenario_family: sender_parity
    generation_instruction: Choose a fresh data string and explicit parity convention; ask about the sender check
      bit.
    correctness_condition: Appended bit completes an even total number of ones
    independent_oracle_rule: Parity bit is the one value making full-frame number-of-ones parity equal the stated
      convention.
    distractor_meanings:
    - Apply odd-parity convention
    - Count length rather than ones
    - Assume fixed appended bit
    scenario_constraints:
    - Stay inside F1 numerical/cognitive bounds
    - Generate actual parameters for this attempt; never copy a fixed historical bit string
    - All assumptions necessary for truth must be visible to learner
    - 'Blueprint focus: Build/check even-parity frame'
    - 'Mandatory parity convention for this blueprint: even; numerical values not fixed'
    equivalence_conditions:
    - Preserve the specific construct and slot reasoning operation, not numerical literals
    - Ensure exactly one correct proposition; three distractors express distinct false claims under THIS realized
      scenario
    - Avoid answering another item and avoid unexplained extra cognitive demand
    - No fixed option-letter mapping or pre-authored learner-facing stem
    verification:
    - Compute scientific outcome from actual generated instance using designated oracle
    - Check that generated visible propositions preserve distinct intended meanings and have one unequivocally
      correct alternative
    - Where semantics cannot be established confidently, flag for review; do not accept solely on syntax, IDs
      or equality
    - Verify the slot-specific required_instance_conditions, not only the generic scenario family
    reference_restriction: Historical v0.3 item instances may be used for calibration only, never as mandatory
      live scenario or question wording.
    required_instance_conditions: Force stated even convention; sample at least two independently generated data
      patterns
  - id: C1-A1-Q2
    type: MCQ
    slot_number: 2
    transition_id: C1
    blueprint_id: C1-A1
    shared_role: complete-frame receiver test
    scientific_purpose: Interpret the receiver check on a clean even-parity full frame
    solo_evidence_role: one applicable receiver check
    scenario_family: receiver_parity
    generation_instruction: Start from a valid single-parity frame; create valid or specified altered received
      frame.
    correctness_condition: Count complete received frame including appended bit and compare with even convention
    independent_oracle_rule: Receiver pass is parity(received full frame)==agreed convention; pass is not proof
      of no flips.
    distractor_meanings:
    - Exclude check bit
    - Count zeroes
    - Treat successful check as proof no corruption
    scenario_constraints:
    - Stay inside F1 numerical/cognitive bounds
    - Generate actual parameters for this attempt; never copy a fixed historical bit string
    - All assumptions necessary for truth must be visible to learner
    - 'Blueprint focus: Build/check even-parity frame'
    - 'Mandatory parity convention for this blueprint: even; numerical values not fixed'
