      - id: C2-P1-MOVE-1
        transition_id: C2
        pedagogy_id: P1
        title: Part A — show dependency/repetition
        purpose: |
          Model several distinct components that become relevant once the learner already understands basic recursive Fibonacci.
        kc_ids:
          - K4
          - K5
          - K6
          - K7
          - K8
          - K9
        relation_ids:
          - R2
          - R3
          - R4
          - R5
        misconception_ids:
          - M2
          - M3
          - M5
          - M6
          - M8
        material_blueprint: |
          Use a small naive recursive call tree, for example:

          ```text
          fib(5)
          ├── fib(4)
          │   ├── fib(3)
          │   └── fib(2)
          └── fib(3)
          ```

          Explicitly identify:

          - a recursive dependency;
          - a repeated subproblem such as `fib(3)`;
          - the fact that naive recursion computes it again when no result was retained.
        allowed_behavior:
          - present solved example
          - explain reasoning
        prohibited_behavior:
          - "C2 boundary:\nThe Tutor may name and demonstrate the pieces, but should not make the full C3 causal chain the
            central instructional object.\n\nThe learner is being equipped with multiple relevant components."
        completion_evidence: |
          All target components have been modeled as identifiable pieces and the learner can recognize at least several of them.

