  subsection_order: &id007
  - C4.1
  - C4.2
  - C4.3
  section_level_moves:
  - subsection_id: C4.1
    instructional_destination: Recognize the broader structure shared by familiar parity systems, and understand how
      a checking rule can apply to explicitly defined groups outside a row/column grid.
  - subsection_id: C4.2
    instructional_destination: Formulate and justify a principle that predicts when parity-based checking arrangements
      detect or miss an error, **independently of the spatial arrangement of their checks**.
  - subsection_id: C4.3
    instructional_destination: Transfer a generalized parity principle to unfamiliar systems, and use it for **justified
      prediction, counterexample, and critical evaluation**, not merely more parity calculations.
