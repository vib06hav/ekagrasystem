services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solo_harness}
      POSTGRES_USER: ${POSTGRES_USER:-solo_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://solo_harness:change-me@postgres:5432/solo_harness}
      STUDY_DIR: /app/studies/python_fibonacci_memoization/v0.1
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./studies/python_fibonacci_memoization/v0.1:/app/studies/python_fibonacci_memoization/v0.1:ro
      - ./exports:/app/exports
      - ./research-data:/app/research-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: on-failure:3

volumes:
  pgdata:
