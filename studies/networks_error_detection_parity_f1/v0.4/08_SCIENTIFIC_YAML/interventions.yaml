schema: ekagra.scientific.interventions.v0.4
status: CANDIDATE_UNAPPROVED
instruction_pools: Retain verified instruction-only P1–P3, G1–G3; X1 row-only, X2 duplicate global parity, X6
  placement/convention; no assessment pool IDs
shared_rules:
- One scientific target and matched opportunity budget per transition across P1/P2/P3
- No use of private assessment instances or assessment keys by Tutor
- Instructional scenarios are regenerated within approved F1 scope and checked; historical identifiers are examples
  only
- Tutor must condition each subsequent turn on the learner's latest response while preserving assigned treatment
  mechanism
- A fixed required-move checklist may guide fidelity review but must not advance automatically merely because
  a turn elapsed
- No compulsory numerical examples or same bit string every session
pedagogies:
- id: P1
  label: Worked Example
  mechanism: Tutor explicitly MODELS the target organization in a fully resolved instructional example, including
    the why and the boundary of the conclusion.
  must:
  - show one complete, scientifically checked example from instruction pool
  - verbalize target structural organization
  - include a short engagement/application request without withholding the modeled chain
  must_not:
  - turn main example into learner-led discovery
  - make pairwise contrast the main instruction
  - reveal assessment-only scenarios
  runtime_contract: Treatment signature must appear in actual student-visible actions, not just a label in a prompt
    or stubbed fidelity note.
- id: P2
  label: Guided Questioning
  mechanism: Tutor ELICITS the target organization through a bounded sequence of learner responses, contingent
    probes, and minimal corrective facts.
  must:
  - pose a sequence that spans the required conceptual moves
  - give learner time to construct links
  - probe contradictions without announcing the final chain
  - record inability to reach target within capped turns
  must_not:
  - write the complete model solution before learner constructs it
  - switch to Worked Example on struggle
  - make comparing prepared paired cases the primary teaching mechanism
  runtime_contract: Treatment signature must appear in actual student-visible actions, not just a label in a prompt
    or stubbed fidelity note.
- id: P3
  label: Contrasting Cases
  mechanism: Tutor uses CONTROLLED CASE PAIRS varying one diagnostic feature to elicit the target idea from comparison.
  must:
  - state controlled invariants and only the purposeful differences
  - ask which difference changes the receiver result and why
  - include a discrimination or transfer question on a separately checked instructional case
  must_not:
  - substitute a sequence of unconnected questions
  - change difficulty or number of variables across cases without reason
  - turn into expository Worked Example
  runtime_contract: Treatment signature must appear in actual student-visible actions, not just a label in a prompt
    or stubbed fidelity note.
cells:
- id: C1-P1
  transition_id: C1
  pedagogy_id: P1
  scientific_goal: Establish one usable relationship between sender-selected check bit and receiver-complete-frame
    test.
  target_refs: &id001
  - K1
  - K2
  - K3
  - R1
  instructional_scenario: Show a fresh checked even-parity instructional frame, appended check bit, and its single-flip
    receiver test. Then ask on distinct P2 why a receiver includes the parity bit.
  required_moves:
  - name agreed even-parity rule
  - model parity-bit choice
  - show complete-frame check and mismatch
  - invite simple application
  prohibition: Do not teach multi-flip miss laws or 2D location.
  fidelity_observation: Inspect participant transcript to confirm Tutor explicitly MODELS the target organization
    in a fully resolved instructional example, including the why and the boundary of the conclusion.
  pool: P1–P3 and G1–G3 only; X1/X2/X6 instruction-only; no checksum
  completion: Teaching budget complete or required moves attempted, never a science-pass declaration
  instructional_scenario_note: Historical example IDs in this cell are provenance pointers only; they are not
    compulsory runtime bit strings. Use a separately generated and verified instruction-only instance.
  learner_contingency:
    if_correct_without_reason: Elicit required level-specific explanation only, within assigned pedagogy
    if_materially_incorrect: Diagnose misconception with verified bounded case and respond using assigned mechanism
    if_sufficient: Consolidate; teaching cannot declare SOLO pass; assessment remains independent
  must_not: Do not switch pedagogy, copy a fixed scripted dialogue, expose assessment scenarios, or advance when
    student response was not actually processed.
