schema: ekagra.scientific.conversation_judge.v0.5-candidate
status: CANDIDATE_UNAPPROVED_REQUIRES_HUMAN_REVIEW_AND_RUNTIME_INTEGRATION
role: LLM semantic instructional supervisor; sees treatment, section, subsection and actual teaching dialogue. NOT an
  independent learner assessment Judge.
inputs_required:
- Active section and subsection IDs; locked required_content refs and relevant goals/boundaries
- Global pedagogy rules plus parent section×pedagogy and child subsection×pedagogy rules
- Learner-visible dialogue and any earlier Judge guidance needed to assess the active subsection
- Latest learner response, if any; Tutor's non-authoritative readiness to be reviewed
- Verified instructional instance facts including stated assumptions/coordinates/convention
- Current candidate exposure usage and approved operational limits, if active
never_inputs:
- Formal assessment question/answer/key
- Formal Subjective Judge private evaluation or MCQ score
- Other participant histories
semantic_criteria:
- id: CONTENT_DELIVERED
  question: For EACH required fact, was a scientifically correct understandable explanation or demonstration actually
    given, not just named/asked as an unanswered question?
- id: MOVE_ENACTED
  question: Did the learner-visible dialogue actually carry out the prescribed global/section/subsection pedagogy moves,
    in the necessary order?
- id: LEARNER_SIGNAL
  question: 'What is the latest learner meaning: new doubt, specific misconception, silence, I do not know, frustration
    with repetition, an answer to P2 prompting, or request to continue?'
- id: SCIENCE_AND_SCOPE
  question: Any incorrect bit count, row/column check, check-bit-cell error, missing corner, assumption violation or
    later-section content prematurely demanded?
- id: CONTINGENCY
  question: Has the Tutor addressed the learner signal through the active pedagogy without requiring correctness and
    without an unproductive repeated prompt?
- id: BOUNDARY
  question: Has the Tutor answered any relevant learner doubt, and stayed within approved instructional scope and limits?
    Do not demand a separate subsection-end clarification opportunity.
- id: EVIDENCE
  question: Does the actual learner-visible dialogue substantively demonstrate required concepts and pedagogy moves?
    Judge the meaning; do not demand literal quotations or database message IDs in the output.
decisions:
- action: CONTINUE
  precondition: Required teaching remains incomplete, a relevant learner doubt needs a Tutor answer, or a scientific
    explanation can still be repaired through permitted instruction.
  output_guidance: Briefly identify the missing or incorrect instruction and what the Tutor should do next.
- action: ADVANCE
  precondition: All required facts and pedagogy moves have been substantively delivered, any relevant learner doubt
    addressed, and serious scientific errors corrected. No learner mastery test or extra confirmation is required.
  output_guidance: State why the subsection instruction is complete; the backend handles ordering and transition.
- action: HOLD
  precondition: A serious science or instructional-delivery defect cannot be safely resolved through permitted
    continuation. Ordinary learner mistakes, confusion and incomplete teaching are NOT grounds for HOLD.
  output_guidance: Identify the concrete blocker requiring staff review; do not score the learner as failed.
output_contract:
  decision: CONTINUE|ADVANCE|HOLD
  guidance: Brief natural-language instruction for CONTINUE, completion justification for ADVANCE, or specific blocker
    for HOLD. Do not emit move IDs, content IDs, message UUIDs, confidence labels, quotation excerpts or evidence arrays.
invocation_candidate:
  status: PROVISIONAL_REQUIRES_LATENCY_AND_RELIABILITY_PILOT
  on_tutor_ready_for_judge: true
  on_unanswered_learner_turn_before_tutor_reply: false
  automatic_progression_after_valid_advance: true
authority:
  semantic_model: Judges instructional completeness and treatment fidelity against the actual dialogue; does not assess
    learner SOLO mastery or decide formal section pass/fail.
  runtime: Owns transcript provenance, legal subsection order, permitted transitions and Paas/assessment gate.
  tutor: Produces learner-visible pedagogy-constrained instruction and non-authoritative review readiness.
  no_infinite_loop: Unattended Tutor/Judge review cycles must be bounded, without requiring a compulsory learner
    acknowledgement at every subsection boundary.
independence: Formal assessment and formal Subjective Judge remain treatment-blind and never take this Judge output as
  learner SOLO evidence.
