  - id: C1-A1-S
    type: SUBJECTIVE
    slot_number: 4
    transition_id: C1
    blueprint_id: C1-A1
    shared_role: elicitation of one usable parity aspect with opportunity for sender-receiver connection
    scientific_purpose: Explain how an even-parity check bit is chosen and what the receiver checks
    scenario_family: receiver_parity
    generation_instruction: Start from a valid single-parity frame; create valid or specified altered received
      frame.
    target_structural_evidence: at least one correct sender or complete-frame receiver aspect; linking both merits
      full credit
    partial_or_boundary_evidence: correct isolated rule with reason
    materially_invalid_reasoning_example: equating parity with block length
    legitimate_alternative_explanation: equivalent concise numerical or verbal reasoning
    score_anchor: &id002
      zero: No usable or materially correct parity aspect in the actual question context.
      one: At least one correct usable sender-rule or complete-frame receiver-test aspect with identifiable reasoning,
        not a numerical guess.
      two: Correctly links sender choice and full-frame receiver check and appropriately interprets the actual
        case.
    judge_instruction: Assess the learner response against the exact frozen generated subjective question AND
      verified instance. Accept valid nonstandard reasoning, no keyword or text-match requirements.
    equivalence_conditions:
    - Generated question must elicit the specified structural understanding, not merely a numerical answer
    - Do not embed the key explanation or cue a unique expected sentence
    - Allow materially equivalent explanations and justified alternative witnesses
    - No identical mandatory stem, bit pattern or response text
    verification:
    - Subjective question retains item reasoning demand within bounded generated scenario
    - Judge receives the real frozen question, real learner response and true instance facts; never pedagogy or
      MCQ score
    - Human calibration required for score and SOLO interpretation
    - Verify the slot-specific required_instance_conditions, not only the generic scenario family
    reference_restriction: Synthetic responses are illustrative only; no canned correct sentence is an answer
      authority.
    required_instance_conditions: Use a fresh even-convention full frame; ask for a conceptual rule not only a
      bit
